services:
  mongo1:
    image: mongo:7
    container_name: invoices_mongo
    restart: unless-stopped
    entrypoint: ["bash", "-c", "install -m 400 -o 999 -g 999 /run/mongo-keyfile /tmp/keyfile && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["mongod", "--auth", "--replSet", "rs0", "--keyFile", "/tmp/keyfile", "--bind_ip_all", "--port", "27017", "--wiredTigerCollectionBlockCompressor=zstd"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./deploy/mongo/keyfile:/run/mongo-keyfile:ro,z
    networks:
      default:
        aliases:
          - mongo1.localhost

  mongo2:
    image: mongo:7
    container_name: invoices_mongo2
    restart: unless-stopped
    entrypoint: ["bash", "-c", "install -m 400 -o 999 -g 999 /run/mongo-keyfile /tmp/keyfile && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["mongod", "--auth", "--replSet", "rs0", "--keyFile", "/tmp/keyfile", "--bind_ip_all", "--port", "27018", "--wiredTigerCollectionBlockCompressor=zstd"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongo2_data:/data/db
      - ./deploy/mongo/keyfile:/run/mongo-keyfile:ro,z
    networks:
      default:
        aliases:
          - mongo2.localhost

  mongo3:
    image: mongo:7
    container_name: invoices_mongo3
    restart: unless-stopped
    entrypoint: ["bash", "-c", "install -m 400 -o 999 -g 999 /run/mongo-keyfile /tmp/keyfile && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["mongod", "--auth", "--replSet", "rs0", "--keyFile", "/tmp/keyfile", "--bind_ip_all", "--port", "27019", "--wiredTigerCollectionBlockCompressor=zstd"]
    ports:
      - "127.0.0.1:27019:27019"
    volumes:
      - mongo3_data:/data/db
      - ./deploy/mongo/keyfile:/run/mongo-keyfile:ro,z
    networks:
      default:
        aliases:
          - mongo3.localhost

  vault:
    image: hashicorp/vault:1.20
    container_name: invoices_vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"

  app:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://invoices_app:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}@mongo1.localhost:27017,mongo2.localhost:27018,mongo3.localhost:27019/invoices_db?authSource=admin&replicaSet=rs0
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/vault_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
    volumes:
      - ./deploy/vault/role_id:/run/secrets/vault_role_id:ro,z
      - ./deploy/vault/secret_id:/run/secrets/vault_secret_id:ro,z
    depends_on:
      - mongo1
      - mongo2
      - mongo3
      - vault
    ports:
      - "8000:8000"

volumes:
  mongo_data:
  mongo2_data:
  mongo3_data:
