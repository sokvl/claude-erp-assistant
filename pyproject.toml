[tool.pytest.ini_options]
pythonpath = ["src", "tests", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration and not vault and not lake'"
markers = [
    "integration: requires a live MongoDB on localhost:27017",
    "vault: requires a live Vault dev server at VAULT_TEST_ADDR (default http://127.0.0.1:8200)",
    "lake: requires the S3 store named by the LAKE_* variables (Garage locally)",
]

[tool.coverage.run]
source = ["src/app", "lake"]
branch = true
omit = ["*/__init__.py", "lake/definitions.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
