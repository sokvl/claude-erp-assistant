[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration and not vault'"
markers = [
    "integration: requires a live MongoDB on localhost:27017",
    "vault: requires a live Vault dev server at VAULT_TEST_ADDR (default http://127.0.0.1:8200)",
]

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
