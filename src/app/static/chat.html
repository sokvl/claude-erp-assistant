<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385;
    --user: #2d5bd6; --user-text: #ffffff; --border: #dde1e8; --error: #b3261e; --tool: #7a5c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --panel: #1d2027; --text: #e6e8ee; --muted: #9aa1b2;
      --user: #4a78f0; --user-text: #ffffff; --border: #2d313b; --error: #ff8a80; --tool: #e0b64a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header strong { margin-right: auto; }
  input, textarea, button { font: inherit; color: var(--text); background: var(--bg);
                            border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  button { cursor: pointer; background: var(--panel); }
  button.primary { background: var(--user); color: var(--user-text); border-color: var(--user); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .note { align-self: flex-start; font-size: 13px; color: var(--muted); font-style: italic; }
  .note.tool { color: var(--tool); }
  .note.error { color: var(--error); font-style: normal; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  textarea { flex: 1; resize: none; height: 56px; }
</style>
</head>
<body>
<header>
  <strong>Store Assistant</strong>
  <input id="key" type="password" placeholder="X-API-Key" autocomplete="off">
  <button id="reset" type="button">New conversation</button>
</header>
<div id="log"><div class="note">Ask about products, e.g. "Customer wants to fine-tune a 13B model, budget $2k".</div></div>
<form id="form">
  <textarea id="input" placeholder="Type the customer's question. Enter to send, Shift+Enter for a new line."></textarea>
  <button id="send" class="primary" type="submit">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const keyInput = document.getElementById("key");
  let conversationId = null;

  try { keyInput.value = localStorage.getItem("assistant-api-key") || ""; } catch {}
  keyInput.addEventListener("change", () => {
    try { localStorage.setItem("assistant-api-key", keyInput.value); } catch {}
  });

  document.getElementById("reset").addEventListener("click", () => {
    conversationId = null;
    log.innerHTML = "";
    addNote("New conversation started.");
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
  });

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  const addNote = (text, kind = "") => add(`note ${kind}`, text);

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send.disabled = true;
    add("msg user", message);
    let bubble = null;

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": keyInput.value },
        body: JSON.stringify({ conversation_id: conversationId, message }),
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        const detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail ?? body);
        addNote(`HTTP ${response.status}: ${detail}`, "error");
        if (response.status === 404) conversationId = null;
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let finished = false;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const raw = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          let event = "message";
          const dataLines = [];
          for (const line of raw.split("\n")) {
            if (line.startsWith(":")) continue;
            if (line.startsWith("event:")) event = line.slice(6).trim();
            else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
          }
          if (!dataLines.length) continue;
          const data = JSON.parse(dataLines.join("\n"));

          if (event === "conversation") conversationId = data.conversation_id;
          else if (event === "tool") addNote(`looking up: ${data.name}`, "tool");
          else if (event === "text") {
            if (!bubble) bubble = add("msg assistant", "");
            bubble.textContent += data.text;
            log.scrollTop = log.scrollHeight;
          } else if (event === "done") {
            finished = true;
            if (data.truncated) addNote("Answer was cut off at the length limit.");
          } else if (event === "error") {
            finished = true;
            addNote(`${data.message} (${data.code})`, "error");
          }
        }
      }
      if (!finished) addNote("Connection closed before the answer finished.", "error");
    } catch (err) {
      addNote(`Request failed: ${err.message}`, "error");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
