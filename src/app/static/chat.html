<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --accent: #8FA6C2; --accent-2: #C7CEDA;

    --win-bg: rgba(22, 23, 27, 0.92);
    --panel: rgba(255, 255, 255, 0.035);
    --panel-strong: rgba(255, 255, 255, 0.065);
    --blur-win: blur(44px);
    --blur-field: blur(16px);

    --text: #e7e7ec; --muted: #8b8d98;
    --border: rgba(255, 255, 255, 0.08);
    --user-text: #14161a;
    --error: #e08590; --tool: #9aa7bd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 15px/1.5 'Inter', system-ui, sans-serif;
    color: var(--text); background: #0a0b0d; position: relative;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -20px; z-index: -2;
    background: url("/static/bg.jpg") center/cover no-repeat;
    filter: blur(20px) brightness(0.8) saturate(1.1);
    transform: scale(1.08);
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(1400px 900px at 15% -10%, rgba(28, 30, 38, 0.3) 0%, transparent 55%),
                radial-gradient(1200px 800px at 100% 110%, rgba(10, 14, 18, 0.32) 0%, transparent 55%),
                linear-gradient(160deg, rgba(6, 7, 9, 0.32) 0%, rgba(10, 11, 14, 0.2) 50%, rgba(6, 7, 9, 0.35) 100%);
  }

  .window {
    width: min(920px, 100%); height: min(720px, 92vh);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--win-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), 0 2px 0 rgba(255, 255, 255, 0.04) inset;
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    @media not (prefers-reduced-transparency: reduce) {
      .window { backdrop-filter: var(--blur-win); -webkit-backdrop-filter: var(--blur-win); }
    }
  }

  .titlebar {
    position: relative; display: flex; align-items: center; justify-content: center;
    height: 42px; flex-shrink: 0;
    background: var(--panel-strong); border-bottom: 1px solid var(--border);
  }
  .titlebar .title {
    font-weight: 700; font-size: 13px; letter-spacing: 0.04em; color: var(--muted);
  }

  header {
    display: flex; gap: 10px; align-items: center; padding: 10px 16px;
    flex-wrap: wrap; flex-shrink: 0;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header strong {
    margin-right: auto; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    font-size: 0.85rem; color: var(--accent-2);
  }
  input, textarea, button {
    font: inherit; color: var(--text); background: var(--panel-strong);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
    transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    input, textarea, button { backdrop-filter: var(--blur-field); -webkit-backdrop-filter: var(--blur-field); }
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(143, 166, 194, 0.18);
  }
  button {
    cursor: pointer; font-weight: 600; letter-spacing: 0.01em;
    transition: transform 150ms cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 150ms ease, background 150ms ease, border-color 150ms ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
  button:focus-visible {
    outline: none; border-color: transparent;
    box-shadow: 0 0 0 1px rgba(20, 22, 26, 0.6), 0 0 0 3px var(--accent), 0 4px 18px rgba(143, 166, 194, 0.4);
    background-image: linear-gradient(var(--panel-strong), var(--panel-strong)), linear-gradient(135deg, var(--accent), var(--accent-2));
    background-origin: border-box; background-clip: padding-box, border-box;
  }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--user-text); border-color: transparent; font-weight: 700;
  }
  button.primary:hover:not(:disabled) { box-shadow: 0 8px 24px rgba(143, 166, 194, 0.35); }
  button:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg {
    max-width: 640px; padding: 10px 14px; border-radius: 14px;
    word-wrap: break-word;
    animation: reveal-in 350ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .assistant :is(h1, h2, h3) { margin: 0.4em 0 0.3em; font-weight: 700; letter-spacing: 0.01em; }
  .assistant h1 { font-size: 1.15rem; }
  .assistant h2 { font-size: 1.05rem; }
  .assistant h3 { font-size: 0.95rem; }
  .assistant p { margin: 0 0 0.5em; }
  .assistant p:last-child { margin-bottom: 0; }
  .assistant ul, .assistant ol { margin: 0.3em 0 0.5em; padding-left: 1.3em; }
  .assistant li { margin: 0.15em 0; }
  .assistant code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: rgba(255, 255, 255, 0.08); padding: 1px 5px; border-radius: 5px; }
  .assistant pre { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0.4em 0; }
  .assistant pre code { background: none; padding: 0; }
  .assistant a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .assistant blockquote { margin: 0.4em 0; padding-left: 0.8em; border-left: 2px solid var(--accent); color: var(--muted); }
  .assistant img { max-width: 100%; border-radius: 10px; margin: 0.4em 0; display: block; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3); }
  .assistant table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.9em; }
  .assistant th, .assistant td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .assistant th { background: rgba(255, 255, 255, 0.06); font-weight: 600; }
  .assistant hr { border: none; border-top: 1px solid var(--border); margin: 0.6em 0; }
  .user {
    align-self: flex-end; color: var(--user-text); white-space: pre-wrap;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }
  .assistant {
    align-self: flex-start;
    background: var(--panel-strong);
    border: 1px solid var(--border);
  }
  .note { align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--muted); }
  .note.tool { color: var(--tool); }
  .note.error { color: var(--error); font-weight: 500; }

  .suggestion {
    align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    color: var(--muted); display: flex; gap: 8px; align-items: baseline;
  }
  .suggestion .suggestion-label { color: #5d6070; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; }
  .suggestion .cursor { color: var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .note.thinking { display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid rgba(143, 166, 194, 0.25); border-top-color: var(--accent);
    animation: spin 700ms linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  form {
    display: flex; gap: 10px; padding: 14px 16px; flex-shrink: 0;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  textarea { flex: 1; resize: none; height: 52px; }

  @keyframes reveal-in {
    0% { opacity: 0; transform: translateY(10px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <span class="title">Store Assistant</span>
  </div>
  <header>
    <strong>Store Assistant</strong>
    <input id="key" type="password" placeholder="X-API-Key" autocomplete="off">
    <button id="reset" type="button">New conversation</button>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Type the customer's question. Enter to send, Shift+Enter for a new line."></textarea>
    <button id="send" class="primary" type="submit">Send</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
  marked.setOptions({ gfm: true, breaks: true });

  function renderMarkdown(el, raw) {
    const html = DOMPurify.sanitize(marked.parse(raw), { ADD_ATTR: ["target"] });
    el.innerHTML = html;
    el.querySelectorAll("a[href]").forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  }

  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const keyInput = document.getElementById("key");
  let conversationId = null;

  const suggestions = [
    'Customer wants to fine-tune a 13B model, budget $2k.',
    'What do we have in stock from NVIDIA?',
    'Can you examine our revenue from last month?',
  ];
  let typewriterTimer = null;

  function renderSuggestions() {
    const el = document.createElement("div");
    el.className = "suggestion";
    el.id = "suggestion";
    el.innerHTML = '<span class="suggestion-label">Try asking</span><span id="typewriter"></span><span class="cursor">|</span>';
    log.appendChild(el);

    let sIndex = 0, cIndex = 0, deleting = false;
    const typewriterEl = el.querySelector("#typewriter");

    function tick() {
      const current = suggestions[sIndex];
      if (!deleting) {
        cIndex++;
        typewriterEl.textContent = current.slice(0, cIndex);
        if (cIndex === current.length) {
          typewriterTimer = setTimeout(() => { deleting = true; tick(); }, 1600);
          return;
        }
      } else {
        cIndex--;
        typewriterEl.textContent = current.slice(0, cIndex);
        if (cIndex === 0) {
          deleting = false;
          sIndex = (sIndex + 1) % suggestions.length;
        }
      }
      typewriterTimer = setTimeout(tick, deleting ? 25 : 45);
    }
    tick();
  }

  function stopSuggestions() {
    clearTimeout(typewriterTimer);
    const el = document.getElementById("suggestion");
    if (el) el.remove();
  }

  renderSuggestions();

  document.getElementById("reset").addEventListener("click", () => {
    conversationId = null;
    stopSuggestions();
    log.innerHTML = "";
    addNote("New conversation started.");
    renderSuggestions();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
  });

  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  const addNote = (text, kind = "") => add(`note ${kind}`, text);

  function addThinking() {
    const el = document.createElement("div");
    el.className = "note thinking";
    el.innerHTML = '<span class="spinner"></span>Thinking…';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send.disabled = true;
    stopSuggestions();
    add("msg user", message);
    let bubble = null;
    let bubbleRaw = "";
    let lastTool = null;
    let thinking = addThinking();
    const stopThinking = () => { if (thinking) { thinking.remove(); thinking = null; } };

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": keyInput.value },
        body: JSON.stringify({ conversation_id: conversationId, message }),
      });
      if (!response.ok) {
        stopThinking();
        const body = await response.json().catch(() => ({}));
        const detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail ?? body);
        addNote(`HTTP ${response.status}: ${detail}`, "error");
        if (response.status === 404) conversationId = null;
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let finished = false;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const raw = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          let event = "message";
          const dataLines = [];
          for (const line of raw.split("\n")) {
            if (line.startsWith(":")) continue;
            if (line.startsWith("event:")) event = line.slice(6).trim();
            else if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
          }
          if (!dataLines.length) continue;
          const data = JSON.parse(dataLines.join("\n"));

          if (event === "conversation") conversationId = data.conversation_id;
          else if (event === "tool") {
            stopThinking();
            if (data.name !== lastTool) addNote(`looking up: ${data.name}`, "tool");
            lastTool = data.name;
          } else if (event === "text") {
            stopThinking();
            lastTool = null;
            if (!bubble) bubble = add("msg assistant", "");
            bubbleRaw += data.text;
            renderMarkdown(bubble, bubbleRaw);
            log.scrollTop = log.scrollHeight;
          } else if (event === "done") {
            finished = true;
            if (data.truncated) addNote("Answer was cut off at the length limit.");
          } else if (event === "error") {
            finished = true;
            addNote(`${data.message} (${data.code})`, "error");
          }
        }
      }
      if (!finished) addNote("Connection closed before the answer finished.", "error");
    } catch (err) {
      addNote(`Request failed: ${err.message}`, "error");
    } finally {
      stopThinking();
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
