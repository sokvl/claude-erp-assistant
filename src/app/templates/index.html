<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
<form id="login" class="login" hidden>
  <h1>Sign in</h1>
  <input name="username" placeholder="Username" autocomplete="username" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="primary" type="submit">Sign in</button>
  <p class="error" role="alert"></p>
</form>
<div id="app" class="shell" hidden>
  <div class="titlebar">
    <button id="menu" class="icon-button" type="button" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="title">Store Assistant</span>
  </div>
  <div class="shell-body">
    <aside id="sidebar" class="sidebar">
      <nav class="nav" aria-label="Main">
        <a class="nav-item" href="#/invoices" data-route="invoices">
          <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>Invoices
        </a>
        <a class="nav-item" href="#/products" data-route="products">
          <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Products
        </a>
        <a class="nav-item" href="#/audit" data-route="audit">
          <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Audit
        </a>
      </nav>
      <div class="chat-group" data-route="chat">
        <button id="new-chat" class="nav-item" type="button" data-route="chat">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat
        </button>
        <section id="history" class="history" aria-label="Chat history"></section>
      </div>
      <div class="user-card">
        <span class="avatar" aria-hidden="true"></span>
        <span class="user-meta">
          <span class="user-name"></span>
          <span class="user-role"></span>
        </span>
        <button id="logout" class="icon-button" type="button" aria-label="Log out" title="Log out">
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
        </button>
      </div>
    </aside>
    <div class="backdrop"></div>
    <main class="content">
      <section class="view" data-view="chat" hidden>
        <header>
          <h1>Assistant</h1>
          <select id="assistant" aria-label="Assistant" autocomplete="off">
            <option value="advisor">Product advisor</option>
            <option value="analyst">Invoice analyst</option>
          </select>
        </header>
        <div id="log"></div>
        <form id="form" autocomplete="off">
          <textarea id="input" placeholder="Type the customer's question. Enter to send, Shift+Enter for a new line."></textarea>
          <button id="send" class="primary" type="submit">Send</button>
        </form>
      </section>
      <section class="view page" data-view="invoices" hidden>
        <header><h1>Invoices</h1></header>
        <form id="invoice-filters" class="filters" autocomplete="off">
          <label>Invoice id <input name="invoice_id"></label>
          <label>Customer <input name="customer" placeholder="Number or name prefix"></label>
          <label>Currency <input name="currency" class="short" placeholder="USD"></label>
          <label>Status
            <select name="status">
              <option value="">Any</option>
              <option value="open">Open</option>
              <option value="overdue">Overdue</option>
              <option value="cleared">Cleared</option>
            </select>
          </label>
          <label>Posted from <input type="date" name="posted_from"></label>
          <label>Posted to <input type="date" name="posted_to"></label>
          <label>Min open amount <input type="number" name="min_amount" step="any" class="short"></label>
          <label>Max open amount <input type="number" name="max_amount" step="any" class="short"></label>
          <label>As of <input type="date" name="as_of"></label>
          <button class="primary" type="submit">Apply</button>
          <button class="clear" type="button">Clear</button>
        </form>
        <p class="problem" role="alert" hidden></p>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Invoice</th>
                <th>Customer</th>
                <th data-sort="posting_date"><button type="button" class="sort">Posted</button></th>
                <th>Due</th>
                <th class="num" data-sort="amount"><button type="button" class="sort">Open amount</button></th>
                <th>Status</th>
                <th>Cleared</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="empty" hidden></p>
        <div class="pager"></div>
      </section>
      <section class="view page" data-view="products" hidden>
        <header><h1>Products</h1></header>
        <form id="product-filters" class="filters" autocomplete="off">
          <label>Category <select name="category"><option value="">Any</option></select></label>
          <label>Brand <select name="brand"><option value="">Any</option></select></label>
          <label>Architecture <select name="architecture"><option value="">Any</option></select></label>
          <label>Memory <select name="memory_type"><option value="">Any</option></select></label>
          <label>Min price <input type="number" name="min_price" step="any" class="short"></label>
          <label>Max price <input type="number" name="max_price" step="any" class="short"></label>
          <label>Sort by
            <select name="sort_by">
              <option value="name">Name</option>
              <option value="price">Price</option>
              <option value="vram">VRAM</option>
              <option value="fp16">FP16 TFLOPS</option>
              <option value="release_year">Release year</option>
            </select>
          </label>
          <label>Order
            <select name="sort_order">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </label>
          <fieldset class="use-cases"><legend>Use cases</legend></fieldset>
          <button class="primary" type="submit">Apply</button>
          <button class="clear" type="button">Clear</button>
        </form>
        <p class="problem" role="alert" hidden></p>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Name</th><th>Brand</th><th>Category</th><th class="num">List price</th><th>Key specs</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="empty" hidden></p>
        <div class="pager"></div>
      </section>
      <section class="view page" data-view="audit" hidden>
        <header><h1>Audit</h1></header>
        <form id="audit-form" class="filters" autocomplete="off">
          <label>Invoice id <input name="invoice_id" required></label>
          <button class="primary" type="submit">Look up</button>
        </form>
        <p class="problem" role="alert" hidden></p>
        <p class="empty" hidden></p>
        <div class="table-wrap" hidden>
          <table class="data">
            <thead><tr><th>At (UTC)</th><th>Event</th><th>Actor</th><th>Paid on</th><th>Suggested</th><th>Reason</th><th>Conversation</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script type="module" src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
