<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
<form id="login" class="login" hidden>
  <h1>Sign in</h1>
  <input name="username" placeholder="Username" autocomplete="username" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="primary" type="submit">Sign in</button>
  <p class="error" role="alert"></p>
</form>
<div id="app" class="shell" hidden>
  <div class="topbar">
    <button id="menu" class="icon-button" type="button" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span>Store Assistant</span>
  </div>
  <aside id="sidebar" class="sidebar">
    <div class="brand">Store Assistant</div>
    <nav class="nav" aria-label="Main">
      <button id="new-chat" class="nav-item" type="button" data-route="chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat
      </button>
      <a class="nav-item" href="#/audit" data-route="audit">
        <svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Audit
      </a>
    </nav>
    <section id="history" class="history" aria-label="Chat history"></section>
    <div class="sidebar-footer">
      <span id="who" class="who"></span>
      <button id="logout" type="button">Log out</button>
    </div>
  </aside>
  <div class="backdrop"></div>
  <main class="content">
    <section class="view" data-view="chat" hidden>
      <header>
        <h1>Assistant</h1>
        <select id="assistant" aria-label="Assistant" autocomplete="off">
          <option value="advisor">Product advisor</option>
          <option value="analyst">Invoice analyst</option>
        </select>
      </header>
      <div id="log"></div>
      <form id="form" autocomplete="off">
        <textarea id="input" placeholder="Type the customer's question. Enter to send, Shift+Enter for a new line."></textarea>
        <button id="send" class="primary" type="submit">Send</button>
      </form>
    </section>
    <section class="view page" data-view="audit" hidden>
      <header><h1>Audit</h1></header>
      <form id="audit-form" class="filters" autocomplete="off">
        <label>Invoice id <input name="invoice_id" required></label>
        <button class="primary" type="submit">Look up</button>
      </form>
      <p class="problem" role="alert" hidden></p>
      <p class="empty" hidden></p>
      <div class="table-wrap" hidden>
        <table class="data">
          <thead><tr><th>At (UTC)</th><th>Event</th><th>Actor</th><th>Paid on</th><th>Suggested</th><th>Reason</th><th>Conversation</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script type="module" src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
